name: examples

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [ Release ]
        platform: [ Win32, x64 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build examples
        run: msbuild './reshade/examples/Examples.sln' /m /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }}

      - name: Upload examples
        uses: actions/upload-artifact@v6
        with:
          name: examples-${{ matrix.configuration }}-${{ matrix.platform }}
          path: './reshade/bin/${{ matrix.platform }}/${{ matrix.configuration }} Examples/*.addon*'

      - name: Build fxc
        run: msbuild './reshade/ReShadeFXC.vcxproj' /m /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }}

      - name: Upload fxc
        uses: actions/upload-artifact@v6
        with:
          name: fxc-${{ matrix.configuration }}-${{ matrix.platform }}
          path: './reshade/bin/${{ matrix.platform }}/${{ matrix.configuration }}/fxc.exe'

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Create tag name
        id: tag_name
        run: echo "name=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Create tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ${{ steps.tag_name.outputs.name }}

      - name: Create release
        uses: softprops/action-gh-release@v2.6.1
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          files: |
            *.addon*
            fxc.exe
